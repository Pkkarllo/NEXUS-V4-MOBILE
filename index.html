<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08030f"><title>NEXUS V4 Mobile</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"></head><body>
<div class="app"><header><div class="logo">NEXUS <b>V4</b></div><button class="gear">⚙</button></header>
<main><section id="friends"><div class="hello"><span>AMIGOS</span><h1>Conecte-se no NEXUS</h1><p>Encontre pessoas, converse e jogue junto.</p></div><div class="search"><input id="friendName" placeholder="Nome de usuário"><button id="add">Adicionar</button></div><div class="tabs"><button class="on">Todos</button><button>Online</button><button>Pendentes</button></div><div id="empty" class="empty"><div class="orb">◎</div><h2>Nenhum amigo por aqui</h2><p>Para testar agora, adicione <b>NEXUS_Teste</b>.</p></div><div id="friend" class="friend hidden"><div class="avatar">N</div><div><b>NEXUS_Teste</b><small>● Online</small></div><span>›</span></div></section>
